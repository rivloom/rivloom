[package]
name = "rivloom-desktop"
version = "0.1.0-alpha.0"
description = "Rivloom desktop application"
license = "Apache-2.0"
repository = "https://github.com/rivloom/rivloom"
edition = "2024"
rust-version = "1.85"

[features]
test-tauri-commands = []

[lib]
name = "rivloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
getrandom = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
thiserror = "2"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
pretty_assertions = "1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
