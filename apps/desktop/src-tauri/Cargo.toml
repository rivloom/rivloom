[package]
name = "rivloom-desktop"
version = "0.1.0-alpha.0"
description = "Rivloom desktop application"
license = "Apache-2.0"
repository = "https://github.com/rivloom/rivloom"
edition = "2024"
rust-version = "1.85"

[lib]
name = "rivloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
thiserror = "2"
